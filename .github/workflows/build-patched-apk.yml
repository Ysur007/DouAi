name: Build patched APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests before packaging"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-patched-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.DOUAI_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (optional)
        if: ${{ inputs.run_tests }}
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DOUAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOUAI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOUAI_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "DOUAI_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "DOUAI_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DOUAI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "DOUAI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -exec cp {} out/ \;
      - name: Verify release signature
        run: |
          APK=$(find out -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          if echo "$APK" | grep -q unsigned; then
            echo "::error::unsigned APK: release signing secrets are missing"
            exit 1
          fi
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$SIGNER" verify --print-certs "$APK" | head -4

          ls -lh out
          sha256sum out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douai-patched-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
